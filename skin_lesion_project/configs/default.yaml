seed: 42
paths:
  images: data/raw/images
  masks: data/raw/masks
  processed: data/processed
  splits: data/splits
  reports: reports
  checkpoints: outputs/checkpoints
  results: outputs/results
  figures: outputs/figures
  demo: outputs/demo
image_size: 256
detection_size: 512
sample_size: 100
data:
  mask_threshold: 127
  min_box_area_ratio: 0.001
  multi_component_boxes: false
  use_phash_grouping: true
  phash_max_distance: 4
split:
  train: 0.70
  val: 0.15
  test: 0.15
segmentation:
  model: unet
  pretrained: true
  epochs: 40
  batch_size: 4
  learning_rate: 0.0003
  num_workers: 0
  loss: bce_dice
  threshold: 0.5
  amp: true
  augment: true
  largest_component: false
  hole_filling: false
detection:
  epochs: 20
  batch_size: 2
  learning_rate: 0.0005
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 0
  score_threshold: 0.5
  nms_iou_threshold: 0.5
  max_detections: 5
  trainable_backbone_layers: 3
  amp: true
  augment: true
  model: fasterrcnn_resnet50_fpn_v2
  pretrained: true
evaluation:
  boundary_tolerance_px: 2
  consistency_iou_threshold: 0.5
  qualitative_count: 3
